name: Build portfolio resume

on:
  push:
    branches:
      - main
      - 'feat/**'
    paths:
      - 'resume/master.tex'
      - '.github/workflows/build-resume.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-resume:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compile master resume
        uses: xu-cheng/latex-action@v4
        with:
          root_file: resume/master.tex

      - name: Refresh published PDFs
        run: |
          set -eu
          pdf="$(find . -name master.pdf -type f -print -quit)"
          test -n "$pdf"
          cp "$pdf" public/resume.pdf
          cp "$pdf" public/Jayasurya-Pazhani-Resume.pdf
          test -s public/resume.pdf

      - name: Commit generated PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/resume.pdf public/Jayasurya-Pazhani-Resume.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Update compiled portfolio resume"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          fi
